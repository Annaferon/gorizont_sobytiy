name: agents

on:
  schedule:
    # МСК = UTC+3
    # Генерация — 1 раз в сутки
    - cron: '0 1 * * *'        # 04:00 МСК — write (5 новых постов)
    # Обработка нажатий кнопок — каждые 2 часа
    - cron: '30 */2 * * *'     # каждые 2 часа (в :30) — callbacks
    # Публикации — 2 раза в сутки
    - cron: '0 7 * * *'        # 10:00 МСК — all (публикация №1)
    - cron: '0 12 * * *'       # 15:00 МСК — all (публикация №2)
    # Сводка — 1 раз в сутки
    - cron: '0 18 * * *'       # 21:00 МСК — stats
  workflow_dispatch:
    inputs:
      task:
        description: 'write / publish / stats / callbacks / all'
        required: true
        default: 'write'

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - name: Run task
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MODEL: ${{ secrets.OPENROUTER_MODEL }}
          FALLBACK_MODEL: ${{ secrets.FALLBACK_MODEL }}
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          ADMIN_ID: ${{ secrets.ADMIN_ID }}
          CHANNEL_ID: ${{ secrets.CHANNEL_ID }}
        run: |
          CRON="${{ github.event.schedule }}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            python agent.py ${{ github.event.inputs.task }}
          elif [ "$CRON" = "0 1 * * *" ]; then
            python agent.py write
          elif [ "$CRON" = "30 */2 * * *" ]; then
            python agent.py callbacks
          elif [ "$CRON" = "0 7 * * *" ]; then
            python agent.py all
          elif [ "$CRON" = "0 12 * * *" ]; then
            python agent.py all
          elif [ "$CRON" = "0 18 * * *" ]; then
            python agent.py stats
          fi
